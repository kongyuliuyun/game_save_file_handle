# 游戏存档备份工具配置文件
# 修改后重启程序生效；也可在「设置」页面直接编辑并保存。

save_extensions:
- .ba2
- .bsa
- .esm
- .esp
- .phxsav
- .rmmzsave
- .rpgsave
- .sav
- .save
white_list_root_path:
  default:
  - all
save_backup_path: ./game-save-backup
zip_backup_path: ./game-save-backup-zip
remote_dir: /apps/bypy/game-save-backup
keep_local_backup: false
upload_enabled: true
theme: light
upload_threads: 3
verify_upload: true
